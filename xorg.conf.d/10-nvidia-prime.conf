# NVIDIA Primary + Intel iGPU Offload Configuration
# Uses NVIDIA for display, Intel for compute/offload

Section "ServerLayout"
    Identifier     "layout"
    Screen      0  "nvidia"
    Inactive      "intel"
    Option         "AllowNVIDIAGPUScreens"
EndSection

Section "Device"
    Identifier     "nvidia"
    Driver         "nvidia"
    BusID          "PCI:1:0:0"
    Option         "AllowExternalGpus" "True"
    Option         "PrimaryGPU" "Yes"
EndSection

Section "Device"
    Identifier     "intel"
    Driver         "modesetting"
    BusID          "PCI:0:2:0"
    Option         "DRI" "3"
EndSection

Section "Screen"
    Identifier     "nvidia"
    Device         "nvidia"
    Option         "AllowEmptyInitialConfiguration"
EndSection

Section "Screen"
    Identifier     "intel"
    Device         "intel"
EndSection

Section "OutputClass"
    Identifier     "nvidia"
    MatchDriver    "nvidia-drm"
    Driver         "nvidia"
    Option         "AllowExternalGpus" "True"
    Option         "PrimaryGPU" "Yes"
    ModulePath     "/usr/lib/nvidia/xorg"
    ModulePath     "/usr/lib/xorg/modules"
EndSection

Section "OutputClass"
    Identifier     "intel"
    MatchDriver    "i915"
    Driver         "modesetting"
EndSection
